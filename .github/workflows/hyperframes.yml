name: Validate HyperFrames Export

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  hyperframes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python project
        run: python -m pip install -e .
      - name: Create approved synthetic narrated project
        run: |
          mkdir -p /tmp/hf-fixture/assets
          ffmpeg -v error -f lavfi -i "sine=frequency=440:duration=4" -ac 1 -y /tmp/hf-fixture/assets/voice.wav
          python - <<'PY'
          import json
          from pathlib import Path
          from explainer_studio.render import storyboard_hash
          p = Path('/tmp/hf-fixture')
          (p/'project.json').write_text(json.dumps({'voice':'assets/voice.wav','width':1920,'height':1080,'fps':30}))
          board = {'scenes':[{'start':0,'end':2,'headline':'First idea','body':'A short demonstration'},{'start':2,'end':4,'headline':'Second idea','body':'A second demonstration'}]}
          board['approved'] = True
          board['approval_hash'] = storyboard_hash(board)
          (p/'storyboard.json').write_text(json.dumps(board))
          (p/'words.json').write_text(json.dumps([{'start':0,'end':1,'text':'Hello'},{'start':2,'end':3,'text':'world'}]))
          PY
          python scripts/explainer.py export-hyperframes /tmp/hf-fixture --portrait
      - name: Install pinned HyperFrames and GSAP
        working-directory: /tmp/hf-fixture/hyperframes-portrait
        run: npm install --no-audit --no-fund
      - name: HyperFrames lint
        working-directory: /tmp/hf-fixture/hyperframes-portrait
        run: npm run lint
      - name: Render short synthetic MP4
        working-directory: /tmp/hf-fixture/hyperframes-portrait
        run: npm run render
      - name: Verify output streams
        run: |
          test -s /tmp/hf-fixture/hyperframes-portrait/renders/final.mp4
          ffprobe -v error -show_streams /tmp/hf-fixture/hyperframes-portrait/renders/final.mp4 > /tmp/hf-streams.txt
          grep -q codec_type=video /tmp/hf-streams.txt
          grep -q codec_type=audio /tmp/hf-streams.txt
