<!doctype html>
<html lang="{{DOCUMENT_LANGUAGE}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width={{PROJECT_WIDTH}},height={{PROJECT_HEIGHT}}">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; color: var(--ink); font-family: sans-serif; }
    .stage {
      position: absolute; left: var(--stage-x); top: var(--stage-y); width: var(--stage-w); height: var(--stage-h);
      container-type: size; display: flex; padding: 2cqh 2cqw;
    }
    .steps { display: flex; flex-direction: column; justify-content: center; gap: 4cqh; width: 100%; height: 100%; margin: 0; padding: 0; list-style: none; }
    .step {
      display: flex; align-items: center; gap: 4cqw; flex: 1 1 auto; min-height: 0; min-width: 0;
      padding: 2cqh 4cqw; border: 0.45cqmin solid var(--ink); border-radius: 3cqmin; background: var(--paper);
    }
    .num {
      display: grid; place-items: center; width: 12cqmin; height: 12cqmin; border-radius: 50%; flex: none;
      background: var(--accent); color: var(--paper); font-size: 6cqmin; font-weight: 800;
    }
    .label { min-width: 0; font-size: 11cqmin; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main id="root" data-composition-id="root" data-start="0" data-duration="{{SCENE_DURATION}}" data-width="{{PROJECT_WIDTH}}" data-height="{{PROJECT_HEIGHT}}" style="--stage-x: {{STAGE_X}}%; --stage-y: {{STAGE_Y}}%; --stage-w: {{STAGE_W}}%; --stage-h: {{STAGE_H}}%; --ink: {{COLOR_INK}}; --paper: {{COLOR_BACKGROUND}}; --accent: {{COLOR_ACCENT}};">
    <div class="stage">
      <ol class="steps">
        <li class="step step-1"><span class="num">1</span><span class="label">{{TEXT_STEP_1}}</span></li>
        <li class="step step-2"><span class="num">2</span><span class="label">{{TEXT_STEP_2}}</span></li>
        <li class="step step-3"><span class="num">3</span><span class="label">{{TEXT_STEP_3}}</span></li>
      </ol>
    </div>
  </main>
  <script>
    window.__timelines = window.__timelines || {};
    const root = document.getElementById("root");
    const duration = Number(root.dataset.duration);
    const at = (fraction) => duration * fraction;
    const timeline = gsap.timeline({ paused: true });
    const reveal = (selector, fraction) => {
      timeline.fromTo(selector, { autoAlpha: 0, scale: 0.96 }, { autoAlpha: 1, scale: 1, duration: at(0.14), ease: "power2.out", transformOrigin: "50% 50%" }, at(fraction));
    };
    reveal(".step-1", 0.1);
    reveal(".step-2", 0.28);
    reveal(".step-3", 0.46);
    timeline.to({}, { duration }, 0);
    window.__timelines.root = timeline;
  </script>
</body>
</html>
